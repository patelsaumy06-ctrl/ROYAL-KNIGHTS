<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#2563EB" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Technical Grid Lines -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    
    <line x1="120" y1="0" x2="120" y2="630" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="360" y1="0" x2="360" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="840" y1="0" x2="840" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
    <line x1="1080" y1="0" x2="1080" y2="630" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="300" fill="url(#glowGrad)" filter="blur(80px)" />
  <circle cx="1050" cy="480" r="260" fill="url(#glowGrad)" filter="blur(70px)" />

  <!-- Badge / Pill -->
  <g transform="translate(80, 80)">
    <rect width="360" height="40" rx="20" fill="rgba(37,99,235,0.15)" stroke="rgba(59,130,246,0.4)" stroke-width="1.5" />
    <circle cx="24" cy="20" r="6" fill="#10B981" />
    <text x="42" y="25" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">AI-POWERED CRISIS RELIEF</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="200" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
    NeedLink <tspan fill="url(#brandGrad)">AI</tspan>
  </text>
  <text x="80" y="270" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.5">
    Turn Scattered Field Reports Into Decisive Action
  </text>
  
  <!-- Subtitle -->
  <text x="80" y="325" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
    Intelligent disaster triage, live hotspot visualization &amp; auto volunteer dispatch in seconds.
  </text>

  <!-- Feature Cards Grid -->
  <g transform="translate(80, 390)" filter="url(#cardGlow)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="310" height="130" rx="16" fill="rgba(15,23,42,0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="24" y="44" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">⚡ Smart Triage</text>
    <text x="24" y="80" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      <tspan x="24" dy="0">Gemini AI analyzes field</tspan>
      <tspan x="24" dy="20">surveys &amp; scores severity</tspan>
    </text>

    <!-- Card 2 -->
    <rect x="340" y="0" width="310" height="130" rx="16" fill="rgba(15,23,42,0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="364" y="44" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">📍 Live Crisis Map</text>
    <text x="364" y="80" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      <tspan x="364" dy="0">Real-time geo-clustering</tspan>
      <tspan x="364" dy="20">&amp; dynamic risk heatmap</tspan>
    </text>

    <!-- Card 3 -->
    <rect x="680" y="0" width="310" height="130" rx="16" fill="rgba(15,23,42,0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="704" y="44" fill="#F472B6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">🤝 Auto Volunteer Dispatch</text>
    <text x="704" y="80" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      <tspan x="704" dy="0">Skill &amp; proximity matching</tspan>
      <tspan x="704" dy="20">with automated alerts</tspan>
    </text>
  </g>

  <!-- Watermark / Footer info -->
  <text x="80" y="580" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">
    needlink-ai.web.app • Built by Team Royal Knights • Humanitarian Open Initiative
  </text>
</svg>
